<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.32, minimum-scale=0.1, maximum-scale=5.0, user-scalable=yes">
    <title>Log In | Buffy.com Quantitative Wealth Management</title>
    <meta name="description" content="Log in to your Buffy.com account to manage your portfolio, track high-yield growth returns, make deposits, and request instant withdrawals.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background-color: #040711;
            color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-page-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, rgba(4, 7, 17, 0.95) 70%);
        }

        .auth-standalone-card {
            background: rgba(11, 19, 43, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 42px 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(16px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #F4C430, #D4AF37);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #040711;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(244, 196, 48, 0.3);
        }

        .auth-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: #94A3B8;
            margin: 0;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #CBD5E1;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(4, 7, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #F4C430;
            box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.15);
        }

        .password-input-wrapper {
            position: relative;
        }

        .btn-toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94A3B8;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-primary-auth {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #F4C430, #D4AF37);
            color: #040711;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(244, 196, 48, 0.25);
            margin-top: 10px;
        }

        .btn-primary-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(244, 196, 48, 0.35);
        }

        .auth-footer-links {
            text-align: center;
            margin-top: 26px;
            font-size: 0.9rem;
            color: #94A3B8;
        }

        .auth-footer-links a {
            color: #F4C430;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER NAVBAR -->
    <header class="site-header navbar-sticky">
        <div class="nav-container container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-chart-line"></i></div>
                <div class="brand-text">
                    <span class="brand-name">Buffy<span class="gold-accent">.com</span></span>
                    <span class="brand-sub">QUANTITATIVE WEALTH MANAGEMENT</span>
                </div>
            </a>

            <nav class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About Us</a>
                <a href="index.html#plans" class="nav-link">Investment Plans</a>
                <a href="index.html#faq" class="nav-link">FAQ</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>

            <div class="nav-actions">
                <a href="login.html" class="btn-secondary"><i class="fa-solid fa-right-to-bracket"></i> Log In</a>
                <a href="signup.html" class="btn-primary"><i class="fa-solid fa-user-plus"></i> Sign Up <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>
    </header>

    <!-- MAIN LOG IN CONTENT -->
    <div class="auth-page-container">
        <div class="auth-standalone-card">
            <div class="auth-header">
                <div class="logo-icon"><i class="fa-solid fa-chart-line"></i></div>
                <h2>Log In to Buffy.com</h2>
                <p>Access your secure quantitative wealth portfolio</p>
            </div>

            <form id="form-standalone-login">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="login-password" style="margin-bottom: 0;">Password</label>
                        <a href="index.html#contact" style="color: #F4C430; font-size: 0.8rem; text-decoration: none;">Forgot Password?</a>
                    </div>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" placeholder="••••••••••••" required>
                        <button type="button" class="btn-toggle-password" onclick="togglePass('login-password', this)"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <button type="submit" class="btn-primary-auth">Log In <i class="fa-solid fa-right-to-bracket"></i></button>
            </form>

            <div class="auth-footer-links">
                Don't have an account? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>

    <!-- SITE FOOTER -->
    <footer class="site-footer" style="padding: 40px 0 20px 0; background: #03060F;">
        <div class="container text-center" style="font-size: 0.8rem; color: #64748B;">
            <p>© 2026 Buffy.com Financial Technologies Inc. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        document.getElementById('form-standalone-login')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email')?.value || 'investor@buffy.com';
            const userObj = { email: email, name: email.split('@')[0], loggedIn: true };
            localStorage.setItem('buffy_active_session', JSON.stringify(userObj));
            window.location.href = 'index.html?dashboard=true';
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
